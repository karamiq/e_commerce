    {
      "name": "iPhone 15 Pro",
      "description": "Latest Apple smartphone",
      "sku": "IP15PRO-256-BLK",
      "basePrice": 999.99,
      "stockQuantity": 100,
      "isActive": true,
      "imageUrl": "https://example.com/image.jpg"
    }
order: 1000
